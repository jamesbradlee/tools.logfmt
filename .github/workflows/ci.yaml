name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: The snapshot version to publish. Defaults to the commit SHA and -SNAPSHOT suffix.
        required: false

jobs:
  check-dprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: dprint-version
        run: echo "value=$(cat .dprint-version || echo "")" >> $GITHUB_OUTPUT
      - uses: dprint/check@v2.3
        with:
          dprint-version: ${{ steps.dprint-version.outputs.value }}

  check-ktlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - id: ktlint-version
        run: echo "value=$(cat .ktlint-version)" >> $GITHUB_OUTPUT
      - id: ktlint
        env:
          KTLINT_VERSION: ${{ steps.ktlint-version.outputs.value }}
        run: |
          set -eo pipefail
          path="$(mktemp -d)"
          echo "using $KTLINT_VERSION"
          if [ -z "$KTLINT_VERSION" ] || [ "$KTLINT_VERSION" = "latest" ]; then
            url="https://github.com/ktlint/ktlint/releases/latest/download/ktlint"
          else
            url="https://github.com/ktlint/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          fi
          curl -fsSL -o "$path/ktlint" "$url"
          chmod a+x "$path/ktlint"
          "$path/ktlint" --version
          "$path/ktlint" --reporter=plain-summary --reporter=sarif,output="$path/ktlint.sarif.json"
          ok=$?
          # check if the ktlint report exists
          if [ ! -f "$path/ktlint.sarif.json" ]; then
            echo "ktlint-sarif=" >> $GITHUB_OUTPUT
          else
            echo "ktlint-sarif=$path/ktlint.sarif.json" >> $GITHUB_OUTPUT
          fi
          exit $ok
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.ktlint.outputs.ktlint-sarif != ''
        with:
          sarif_file: ${{ steps.ktlint.outputs.ktlint-sarif }}
      - if: steps.ktlint.outcome != 'success'
        run: exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Kotlin Toolchain, JDK & dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/JetbBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yaml', '**/module.yaml', 'templates/*.module-template.yaml', 'libs.versions.toml', '.github/workflows/ci.yaml', 'kotlin', 'kotlin.bat') }}
      - run: ./kotlin test
