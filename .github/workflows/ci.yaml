name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: The snapshot version to publish. Defaults to the commit SHA and -SNAPSHOT suffix.
        required: false

jobs:
  check-dprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: dprint-version
        run: echo "value=$(cat .dprint-version || echo "")" >> $GITHUB_OUTPUT
      - uses: dprint/check@v2.3
        with:
          dprint-version: ${{ steps.dprint-version.outputs.value }}

  check-ktlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - id: ktlint-version
        run: echo "value=$(cat .ktlint-version)" >> $GITHUB_OUTPUT
      - id: ktlint
        env:
          KTLINT_VERSION: ${{ steps.ktlint-version.outputs.value }}
        run: |
          set -eo pipefail
          path="$(mktemp -d)"
          echo "using $KTLINT_VERSION"
          if [ -z "$KTLINT_VERSION" ] || [ "$KTLINT_VERSION" = "latest" ]; then
            url="https://github.com/ktlint/ktlint/releases/latest/download/ktlint"
          else
            url="https://github.com/ktlint/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          fi
          curl -fsSL -o "$path/ktlint" "$url"
          chmod a+x "$path/ktlint"
          "$path/ktlint" --version
          ok=0
          "$path/ktlint" --reporter=plain-summary --reporter=sarif,output="$path/ktlint.sarif.json" || ok=$?
          # check if the ktlint report exists
          if [ ! -f "$path/ktlint.sarif.json" ]; then
            echo "ktlint-sarif=" >> $GITHUB_OUTPUT
          else
            echo "ktlint-sarif=$path/ktlint.sarif.json" >> $GITHUB_OUTPUT
          fi
          exit $ok
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.ktlint.outputs.ktlint-sarif != ''
        with:
          sarif_file: ${{ steps.ktlint.outputs.ktlint-sarif }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Kotlin Toolchain, JDK & dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yaml', '**/module.yaml', 'templates/*.module-template.yaml', 'libs.versions.toml', '.github/workflows/ci.yaml', 'kotlin', 'kotlin.bat') }}
      - run: ./kotlin test

  release:
    needs: [check-ktlint, check-dprint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - name: Cache Kotlin Toolchain, JDK & dependencies
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yaml', '**/module.yaml', 'templates/*.module-template.yaml', 'libs.versions.toml', '.github/workflows/ci.yaml', 'kotlin', 'kotlin.bat') }}
          fail-on-cache-miss: "true"
      - env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version || format('{0}-SNAPSHOT', github.sha) }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -eo pipefail
          export VERSION="${VERSION:-0.1.0}"   # fallback if unset/empty
          rm -rf publish.properties
          echo "central.username=${CENTRAL_TOKEN_USERNAME}" >> publish.properties
          echo "central.password=${CENTRAL_TOKEN_PASSWORD}" >> publish.properties
          yq -i '.settings.publishing.version = strenv(VERSION)' templates/publishing.module-template.yaml
      - env:
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: ./kotlin publish mavenCentral
