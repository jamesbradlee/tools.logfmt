repositories:
  - id: central
    url: https://repo1.maven.org/maven2
    publish: false
    resolve: true
  - id: mavenCentral
    url: https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/
    publish: true
    resolve: false
    credentials:
      file: //publish.properties
      usernameKey: central.username
      passwordKey: central.password

settings:
  publishing:
    enabled: true
    group: tools.logfmt
    version: 0.1.0
    # mavenCentral:
    #   enabled: true
    signArtifacts: true
    publishSources: true
    pom:
      url: https://github.com/jamesbradlee/tools.logfmt
      scm: https://github.com/jamesbradlee/tools.logfmt
      developers:
        - name: James Bradlee
          url: https://github.com/jamesbradlee
      licenses:
        - name: MIT
          url: https://opensource.org/licenses/MIT
