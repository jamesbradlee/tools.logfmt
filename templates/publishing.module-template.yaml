repositories:
  - id: central
    url: https://repo1.maven.org/maven2
    publish: false
    resolve: true
  - id: mavenCentral
    url: https://central.sonatype.com
    publish: true
    resolve: false

settings:
  publishing:
    enabled: true
    group: tools.logfmt
    version: 0.1.0
    # mavenCentral:
    #   enabled: true
    signArtifacts: true
    publishSources: true
    pom:
      url: https://github.com/jamesbradlee/tools.logfmt
      scm: https://github.com/jamesbradlee/tools.logfmt
      developers:
        - name: James Bradlee
          url: https://github.com/jamesbradlee
      licenses:
        - name: MIT
          url: https://opensource.org/licenses/MIT
